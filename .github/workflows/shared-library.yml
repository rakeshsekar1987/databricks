name: Shared Library CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'packages/shared-library/**'
      - '.github/workflows/shared-library.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/shared-library/**'

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  build:
    name: Build Shared Library
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter @platform/shared-library lint

      - name: Type check
        run: pnpm --filter @platform/shared-library typecheck

      - name: Run tests
        run: pnpm --filter @platform/shared-library test

      - name: Build library
        run: pnpm --filter @platform/shared-library build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shared-library-dist
          path: packages/shared-library/dist
          retention-days: 7

  # When shared library changes, trigger builds for all modules
  trigger-module-builds:
    name: Trigger Dependent Module Builds
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Trigger Shell build
        uses: peter-evans/repository-dispatch@v2
        with:
          event-type: shared-library-updated
          client-payload: '{"module": "shell"}'

      # Note: In practice, you might want to be more selective
      # about which modules to rebuild based on semver changes
      - name: Log shared library update
        run: |
          echo "Shared library has been updated"
          echo "Dependent modules will be rebuilt in their next push"
