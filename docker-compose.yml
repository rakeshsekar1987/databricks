version: '3.8'

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timesheet-reminder-bot
    ports:
      - "3978:3978"
    environment:
      - MICROSOFT_APP_ID=${MICROSOFT_APP_ID}
      - MICROSOFT_APP_PASSWORD=${MICROSOFT_APP_PASSWORD}
      - MICROSOFT_APP_TENANT_ID=${MICROSOFT_APP_TENANT_ID}
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET}
      - AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID}
      - TIMESHEET_API_BASE_URL=${TIMESHEET_API_BASE_URL}
      - TIMESHEET_API_KEY=${TIMESHEET_API_KEY}
      - BOT_DOMAIN=${BOT_DOMAIN}
      - PORT=3978
      - REMINDER_CRON_SCHEDULE=${REMINDER_CRON_SCHEDULE:-0 15 * * 5}
      - INCLUDE_MANAGER_IN_REMINDER=${INCLUDE_MANAGER_IN_REMINDER:-true}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3978/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge
