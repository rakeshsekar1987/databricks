version: '3.8'

services:
  # Shell Application (Host)
  shell:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.shell
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      - reg-reporting
      - financial-reporting
      - expense-reporting
      - tax-reporting
      - control-tower
    networks:
      - ui-network

  # Regulatory Reporting Module (AG Grid v31)
  reg-reporting:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.module
      args:
        MODULE_NAME: reg-reporting
    ports:
      - "3001:80"
    networks:
      - ui-network

  # Financial Reporting Module (AG Grid v30)
  financial-reporting:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.module
      args:
        MODULE_NAME: financial-reporting
    ports:
      - "3002:80"
    networks:
      - ui-network

  # Expense Reporting Module (AG Grid v31)
  expense-reporting:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.module
      args:
        MODULE_NAME: expense-reporting
    ports:
      - "3003:80"
    networks:
      - ui-network

  # Tax Reporting Module (AG Grid v29)
  tax-reporting:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.module
      args:
        MODULE_NAME: tax-reporting
    ports:
      - "3004:80"
    networks:
      - ui-network

  # Control Tower Module (AG Grid v31)
  control-tower:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.module
      args:
        MODULE_NAME: control-tower
    ports:
      - "3005:80"
    networks:
      - ui-network

  # Module Registry Service
  module-registry:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ../../infrastructure/module-registry:/app
    command: node server.js
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
    networks:
      - ui-network

networks:
  ui-network:
    driver: bridge
