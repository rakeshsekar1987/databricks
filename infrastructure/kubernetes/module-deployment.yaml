apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${MODULE_NAME}
  namespace: module-federation
  labels:
    app: ${MODULE_NAME}
    tier: frontend
    ag-grid-version: "${AG_GRID_VERSION}"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ${MODULE_NAME}
  template:
    metadata:
      labels:
        app: ${MODULE_NAME}
        ag-grid-version: "${AG_GRID_VERSION}"
    spec:
      containers:
        - name: ${MODULE_NAME}
          image: ${REGISTRY}/${MODULE_NAME}:${VERSION}
          ports:
            - containerPort: 80
          env:
            - name: AG_GRID_VERSION
              value: "${AG_GRID_VERSION}"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /remoteEntry.js
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ${MODULE_NAME}
  namespace: module-federation
spec:
  selector:
    app: ${MODULE_NAME}
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
